databases:
  - name: fourfold-postgres
    databaseName: guessing_game
    user: fourfold
    plan: free
    ipAllowList: []

services:
  - type: web
    name: fourfold-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:asgi_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fourfold-postgres
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://tmyk.vercel.app
      - key: SESSION_RESERVATION_MINUTES
        value: "30"
      - key: ROOM_CODE_LENGTH
        value: "6"
